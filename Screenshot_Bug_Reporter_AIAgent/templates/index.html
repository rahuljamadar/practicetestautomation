<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot Bug Reporter</title>
  <style>
  :root { color-scheme: light; --ink: #17202a; --muted: #64717d; --paper: #f6f2e9; --accent: #d75b3f; --line: #d9d0c2; }
  * { box-sizing: border-box; } body { margin: 0; color: var(--ink); background: radial-gradient(circle at 12% 8%, #f8c9a9 0, transparent 32%), var(--paper); font: 16px Georgia, serif; }
  main { max-width: 980px; margin: 0 auto; padding: 56px 22px; } header { max-width: 650px; } h1 { font-size: clamp(2.8rem, 8vw, 6.8rem); line-height: .9; margin: 0 0 18px; letter-spacing: -.06em; } p { line-height: 1.5; } .eyebrow { color: var(--accent); font: 700 12px Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
  form { margin-top: 42px; display: grid; gap: 18px; background: rgba(255,255,255,.65); border: 1px solid var(--line); padding: 24px; max-width: 720px; } label { font: 700 13px Arial, sans-serif; } input, textarea, button { font: inherit; } input[type=file], textarea { width: 100%; border: 1px solid var(--line); background: #fffdf9; padding: 13px; margin-top: 7px; } textarea { min-height: 110px; resize: vertical; } button { width: fit-content; background: var(--ink); color: white; border: 0; padding: 13px 18px; cursor: pointer; } button:disabled { opacity: .5; cursor: wait; } #status { color: var(--muted); font-family: Arial, sans-serif; } #result { white-space: pre-wrap; background: #17202a; color: #f6f2e9; padding: 20px; overflow: auto; } .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <header><div class="eyebrow">Local QA workflow</div><h1>Turn a screenshot into a Jira bug.</h1><p>Upload the evidence, add any context you have, and let the configured Ollama vision model prepare the defect while Jira receives the original image.</p></header>
  <form id="report-form">
  <label>Screenshot<input id="screenshot" name="screenshot" type="file" accept="image/png,image/jpeg,image/webp" required></label>
  <label>Optional context<textarea name="context" placeholder="What were you trying to do? Which browser or build was used?"></textarea></label>
  <button id="submit" type="submit">Analyze and create Jira issue</button>
  <div id="status" role="status"></div>
  </form>
  <section id="result-section" class="hidden"><h2>Result</h2><pre id="result"></pre></section>
</main>
<script>
  const form = document.querySelector('#report-form'); const button = document.querySelector('#submit'); const status = document.querySelector('#status'); const output = document.querySelector('#result'); const section = document.querySelector('#result-section');
  form.addEventListener('submit', async (event) => { event.preventDefault(); button.disabled = true; status.textContent = 'Analyzing screenshot and creating Jira issue...'; section.classList.add('hidden');
  try { const response = await fetch('/api/report', { method: 'POST', body: new FormData(form) }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Request failed'); output.textContent = JSON.stringify(data, null, 2); section.classList.remove('hidden'); status.textContent = 'Jira issue created.'; }
  catch (error) { status.textContent = error.message; }
  finally { button.disabled = false; }
  });
</script>
</body>
</html>
