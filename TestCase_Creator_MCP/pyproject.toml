[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "testcreator-mcp"
version = "0.1.0"
description = "Local-first MCP server for discovering test cases from a CSV catalog"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["fastmcp==4.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tc-mcp = "tc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
